server {
    listen 80;
    server_name localhost;

    # 1. Раздача статических файлов React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Обратный прокси (Reverse Proxy) к бэкенду
    location /api/ {
        proxy_pass http://locomotive_backend:8080; # Используем имя сервиса в docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Настройки для корректной работы Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Дополнительные заголовки для предотвращения кэширования ответов SSE
        proxy_set_header Connection '';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}